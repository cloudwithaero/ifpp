name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native printer plugin
        run: npm install --no-save @capgo/capacitor-printer@8.1.2

      - name: Patch print action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/page.tsx")
          s = p.read_text(encoding="utf-8")
          react_import = 'import { FormEvent, useEffect, useMemo, useState } from "react";'
          printer_import = 'import { Printer } from "@capgo/capacitor-printer";'
          if printer_import not in s:
              if react_import not in s:
                  raise SystemExit("React import marker not found")
              s = s.replace(react_import, react_import + "\n" + printer_import, 1)
          marker = "  function openPrintPreview() {"
          if "async function handlePrintPlan()" not in s:
              if marker not in s:
                  raise SystemExit("openPrintPreview marker not found")
              handler = (
                  '  async function handlePrintPlan() {\n'
                  '    try {\n'
                  '      await Printer.printWebView({ name: `IFBB Coach - ${playerName || "Plan"}` });\n'
                  '    } catch (error) {\n'
                  '      console.error("Native print failed, falling back to browser print", error);\n'
                  '      if (typeof window !== "undefined") window.print();\n'
                  '    }\n'
                  '  }\n\n'
              )
              s = s.replace(marker, handler + marker, 1)
          s = s.replace('onClick={()=>window.print()}', 'onClick={handlePrintPlan}')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build Next.js static export
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IFBB-Coach-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
